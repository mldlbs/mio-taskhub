# Alertmanager configuration for mio-taskhub
# Place at: ~/.mio_taskhub/alertmanager.yml or /etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@mio-taskhub.local'

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@mio-taskhub.local'
        send_resolved: true
  - name: 'critical'
    email_configs:
      - to: 'admin@mio-taskhub.local'
        send_resolved: true
    webhook_configs:
      - url: 'http://localhost:48620/api/v1/alerts/webhook'
        send_resolved: true
  - name: 'warning'
    email_configs:
      - to: 'ops@mio-taskhub.local'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']