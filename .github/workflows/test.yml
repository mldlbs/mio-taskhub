name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 取全部历史+tag（test_version_consistency 校验 tag 存在）

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 2026-11-10：统计漂移不该让 13 分钟的测试被整步跳过（已踩三次：
      # 11-07 两次、11-09 E7 一次）。改成告警 + 留痕，测试照常跑。
      - name: Check README stats
        id: readme_stats
        continue-on-error: true
        shell: bash
        run: python scripts/gen_readme_stats.py --check

      - name: Warn on README stats drift
        if: steps.readme_stats.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=README 统计漂移::本地运行 python scripts/gen_readme_stats.py --write 并提交；统计数值只影响 README 表格，不影响测试结果。"

      - name: Run tests
        shell: bash
        run: |
          # 2026-11-07 清理 -k 排除项：test_webhook_guard 在 tests/ 全目录无匹配
          # （4 个失败用例已删除）；test_assign.py::test_two_agents_race_one_task_single_run
          # 单跑 1 passed。e2e 仍由 pyproject.toml 的 addopts="-m 'not e2e'" 排除。
          # basetemp 放仓库外：仓库内会让 git 向上发现父仓库使部分用例假红，
          # 且 pytest 清理 garbage-* 会触发 safe-delete 保护。
          # 覆盖率显式传参、不写进 addopts，避免拖慢本地常规全量。
          python -m pytest tests/ -v --tb=short \
            --basetemp="${{ runner.temp }}/pytest-basetemp" \
            --cov=mio_taskhub \
            --cov-report=xml:"${{ runner.temp }}/coverage.xml" \
            --cov-report=term-missing:skip-covered
        env:
          # conftest.py:11 无条件覆盖 MIO_TASKHUB_DB；测试隔离实际读 MIO_TEST_DB_PATH。
          MIO_TEST_DB_PATH: "${{ runner.temp }}/test_taskhub.db"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: "${{ runner.temp }}/coverage.xml"
          if-no-files-found: warn

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  materials-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Materials gate tests
        run: |
          python -m pytest tests/test_materials_gate.py tests/test_materials_validate.py tests/test_gate_attestation.py tests/test_release_entry.py -q
