name: Branch protection audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required status checks
        run: |
          python scripts/check_required_checks.py \
            --repo "${{ github.repository }}" \
            --branch main \
            --require "test (3.12)" \
            --require "materials-gate"
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
