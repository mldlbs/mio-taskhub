[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mio-taskhub"
version = "0.5.5"
description = "Cross-agent task management hub (local single-user service)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "websockets>=12.0",
    "mcp>=1.2,<2",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[project.scripts]
mio-taskhub = "mio_taskhub.main:run"
mio-taskhub-mcp = "mio_taskhub.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mio_taskhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 真服务端到端/并发压测（起真实 uvicorn，较慢；默认排除，用 pytest -m e2e 运行）",
]
addopts = "-m 'not e2e'"

# 覆盖率（T0.3/F5）：不默认进 addopts（避免拖慢每次全量/CI），
# 按需执行验收命令：python -m pytest -q --cov=mio_taskhub --cov-report=term-missing --cov-report=xml
[tool.coverage.run]
source = ["mio_taskhub"]
branch = false
parallel = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
