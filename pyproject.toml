[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mio-taskhub"
version = "0.6.1"
description = "Cross-agent task management hub (local single-user service)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2026-10-13 钉死已知可用版本：CI 全新装到最新版（sqlmodel 0.0.48 /
    # SQLAlchemy 2.1.4 等）后 32 个测试因 naive datetime 校验收紧而挂；
    # 下列为本地全量 1113 passed 验证过的组合（T0.1/9784640a）。
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "sqlmodel==0.0.42",
    "SQLAlchemy==2.0.52",
    "apscheduler==3.11.3",
    "pydantic==2.13.5",
    "websockets>=12.0",
    "mcp==1.29.1",
    "croniter==6.2.4",
    "python-multipart>=0.0.9",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff==0.17.6",
]

[project.scripts]
mio-taskhub = "mio_taskhub.main:run"
mio-taskhub-mcp = "mio_taskhub.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mio_taskhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 真服务端到端/并发压测（起真实 uvicorn，较慢；默认排除，用 pytest -m e2e 运行）",
    "slow: 会起子进程的存活测试（harness 探针/单元实跑）",
]
addopts = "-m 'not e2e'"

# 覆盖率（T0.3/F5）：不默认进 addopts（避免拖慢每次全量/CI），
# 按需执行验收命令：python -m pytest -q --cov=mio_taskhub --cov-report=term-missing --cov-report=xml
[tool.coverage.run]
source = ["mio_taskhub"]
branch = false
parallel = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Ruff（2026-11-23 接入，分阶段收紧：先强制可清零的高价值规则集，
# 复杂度规则按棘轮方式设基线阈值，后续只升不降）
# 运行：ruff check .   自动修复：ruff check --fix
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "web",               # 前端走 ESLint
    "dist", "dist_archives", "dist_perf", "build_perf", "build",
    "packaging", "experiments", "docs", "logs", "mio_taskhub.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告（空白/行尾）
    "F",    # pyflakes（未用导入/变量、未定义名）
    "I",    # isort 导入排序
    "B",    # flake8-bugbear（常见缺陷模式）
    "UP",   # pyupgrade（过时语法）
    "C4",   # flake8-comprehensions
    "C90",  # mccabe 圈复杂度（max-complexity 见下）
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "RUF",  # ruff 自有规则（含 unused noqa）
    "PL",   # pylint 子集（复杂度硬上限见下方参数）
]
ignore = [
    # 中文标点（全角引号/冒号/括号）被误判为 confusable，本库注释与提示词为中文
    "RUF001", "RUF002", "RUF003",
    # FastAPI 惯例：Depends()/Query() 等作为参数默认值
    "B008",
    # 延迟导入是本库既有惯例（CLI/插件/可选依赖惰性加载）
    "PLC0415",
    # %-formatting 存量 260+，dict-% 无法自动迁移，暂不强制（棘轮候选）
    "UP031",
    # API/tool 处理器参数多属常态（FastAPI query 参数、MCP tool 签名）
    "PLR0913", "PLR0917",
    # 魔数值比较：SQLite 状态码/协议常量散布，治理成本高（棘轮候选）
    "PLR2004",
    # ---- 以下为存量债务豁免（2026-11-23 接入时存量，棘轮候选：逐步清理后从 ignore 移除）----
    "E701", "E702",   # 复合行（冒号/分号多语句）存量 169 处
    "B904",           # except 内 raise 无 from：HTTPException 转换链存量 57 处
    "PLW1510",        # subprocess 无 check=True：大量轮询自查 returncode 场景
    "PLW0603", "PLW0602",  # global 语句：遗留模块级配置模式
    "PLW2901",        # 循环变量原地归一化惯用写法
    "E741",           # 单字母歧义变量名存量 24 处
    "RUF059",         # 未使用解包变量存量 27 处
    "E402",           # 顶部外导入：main.py 中间件顺序、平台常量先于导入等有意为之
]

[tool.ruff.lint.mccabe]
max-complexity = 12

# E501 实际上限 160：中文按显示宽度计 2，120 会惩罚正常中文说明文本；
# mcp_server.py / main.py 为 MCP 提示词与内嵌 HTML/JS，文本不可机械换行，单独豁免
[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.pylint]
max-branches = 20      # 棘轮基线（当前峰值≈19），后续只升不降
max-statements = 90    # 棘轮基线
max-returns = 12       # 棘轮基线
max-args = 12

[tool.ruff.lint.per-file-ignores]
"mio_taskhub/mcp_server.py" = ["E501"]   # MCP 提示词文本，内容不可换行
"mio_taskhub/main.py" = ["E501"]         # 内嵌 HTML/CSS/JS 字符串
"scripts/repair_benchmark.py" = ["E501"] # 内嵌基准测试代码 fixture 字符串，不可换行
"tests/**" = [
    "E501",      # 测试内长断言/长注释
    "PLR0912", "PLR0915", "PLR0911",  # 测试用例允许长流程
]
"scripts/**" = ["E402", "PLR2004"]       # 入口脚本常有路径设置后再导入
