[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mio-taskhub"
version = "0.6.0"
description = "Cross-agent task management hub (local single-user service)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 2026-10-13 钉死已知可用版本：CI 全新装到最新版（sqlmodel 0.0.48 /
    # SQLAlchemy 2.1.4 等）后 32 个测试因 naive datetime 校验收紧而挂；
    # 下列为本地全量 1113 passed 验证过的组合（T0.1/9784640a）。
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "sqlmodel==0.0.42",
    "SQLAlchemy==2.0.52",
    "apscheduler==3.11.3",
    "pydantic==2.13.5",
    "websockets>=12.0",
    "mcp==1.29.1",
    "croniter==6.2.4",
    "python-multipart>=0.0.9",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[project.scripts]
mio-taskhub = "mio_taskhub.main:run"
mio-taskhub-mcp = "mio_taskhub.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mio_taskhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 真服务端到端/并发压测（起真实 uvicorn，较慢；默认排除，用 pytest -m e2e 运行）",
    "slow: 会起子进程的存活测试（harness 探针/单元实跑）",
]
addopts = "-m 'not e2e'"

# 覆盖率（T0.3/F5）：不默认进 addopts（避免拖慢每次全量/CI），
# 按需执行验收命令：python -m pytest -q --cov=mio_taskhub --cov-report=term-missing --cov-report=xml
[tool.coverage.run]
source = ["mio_taskhub"]
branch = false
parallel = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
