version: "3.8"

services:
  taskhub:
    build: .
    container_name: mio-taskhub
    ports:
      - "48620:48620"
    volumes:
      - taskhub-data:/data/taskhub
    environment:
      - MIO_TASKHUB_DB=/data/taskhub/taskhub.db
      - MIO_TASKHUB_TOKEN=${MIO_TASKHUB_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:48620/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  taskhub-data:
    driver: local
